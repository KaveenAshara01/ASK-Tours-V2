<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/ask_favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>ASK Travels | Premier Travel Agency in Sri Lanka</title>
    <style>
      /* Nuclear Option for Google Spinner */
      .goog-te-spinner-pos, .goog-te-spinner, .goog-te-spinner-animation, .goog-te-gadget-icon {
        display: none !important; width: 0 !important; height: 0 !important; opacity: 0 !important; padding: 0 !important; pointer-events: none !important;
      }
      .goog-te-banner-frame { display: none !important; }
      body { top: 0 !important; position: static !important; }
      .goog-tooltip { display: none !important; }
      .goog-tooltip:hover { display: none !important; }
      .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
    </style>
    <!-- Pre-flight Cookie Sync-->
    <script>
      (function() {
        try {
          var storedLang = localStorage.getItem('userLang');
          if (storedLang && storedLang !== 'en') {
            var expected = '/en/' + storedLang;
            if (document.cookie.indexOf('googtrans=' + expected) === -1) {
              var d = window.location.hostname;
              var exp = '; expires=Fri, 31 Dec 9999 23:59:59 GMT';
              var path = '; path=/';
              var same = '; SameSite=Lax';
              
              document.cookie = 'googtrans=' + expected + path + same + exp;
              document.cookie = 'googtrans=' + expected + path + '; domain=' + d + same + exp;
              document.cookie = 'googtrans=' + expected + path + '; domain=.' + d + same + exp;
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Immediate Spinner Killer Script -->
    <!-- Immediate Spinner Killer Script -->
    <script>
      (function() {
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.addedNodes) {
              mutation.addedNodes.forEach(function(node) {
                if (node.nodeType === 1) { // Element node
                  // Safe class check (handles SVG)
                  var cName = (typeof node.className === 'string') ? node.className : (node.getAttribute && node.getAttribute('class')) || '';
                  
                  // Check typical container classes
                  if (cName.indexOf('goog-te-spinner') > -1 || cName.indexOf('goog-te-banner') > -1) {
                    node.remove();
                    return;
                  }

                  // Check for images/iframes specifically
                  if (node.tagName === 'IMG' || node.tagName === 'IFRAME') {
                     var src = node.src || '';
                     if (src.indexOf('google') > -1 || src.indexOf('translate') > -1) {
                        node.style.display = 'none'; // Safer than remove() sometimes for iframes
                        node.style.visibility = 'hidden';
                        node.style.height = '0';
                        node.style.width = '0';
                     }
                  }
                }
              });
            }
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <div id="google_translate_element" style="display:none"></div>

    <div id="root">
        <!-- Static Loading State (Prevents FOUC) -->
        <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;display:flex;align-items:center;justify-content:center;">
             <div style="width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #ffc72c;border-radius:50%;animation:spin 1s linear infinite;"></div>
             <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,ru,de,es,zh-CN,fr,it,ja',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
